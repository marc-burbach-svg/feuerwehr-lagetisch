<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Feuerwehr-Lagetisch</title><style>body{margin:0;font:16px system-ui;background:#101b29;color:#f5f7fa}header{padding:14px;background:#b62b25;font-weight:800}main{display:grid;grid-template-columns:230px 1fr;min-height:85vh}aside{background:#1d2b3b;padding:12px}button,label{font:inherit}button,.upload{display:block;box-sizing:border-box;width:100%;margin:7px 0;padding:11px;border:0;border-radius:8px;background:#344b63;color:white;text-align:left;cursor:pointer}.upload input{display:none}#board{position:relative;margin:12px;background:#edf0e8;border:3px solid #728393;border-radius:10px;min-height:65vh;overflow:hidden;touch-action:none;background-size:contain;background-repeat:no-repeat;background-position:center}#board:before{content:'LAGEKARTE – Symbole links auswählen, dann hier tippen';position:absolute;top:8px;left:10px;color:#52606a;font-size:12px;pointer-events:none}.token{position:absolute;min-width:65px;max-width:130px;padding:8px;border:2px solid #1c344e;border-radius:8px;background:#fff;color:#142235;font-size:13px;text-align:center;box-shadow:0 2px 6px #0004;touch-action:none;user-select:none;cursor:grab}.token.selected{outline:3px solid #e2a72a}.token strong{display:block;font-size:20px}h3{margin:8px 0}.hint{font-size:12px;color:#bdcbd8}#status{padding:9px;background:#182b3c} @media(max-width:700px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}aside h3,aside p{grid-column:1/-1}#board{min-height:58vh}}</style></head><body><header>🚒 Feuerwehr-Lagetisch · Touch-Version</header><main><aside><h3>Taktische Zeichen (Übungssymbole)</h3><p class="hint">Symbol auswählen, dann auf die Lagekarte tippen.</p><button data-type="🚒|TSF-W 6-48-1">🚒 TSF-W</button><button data-type="🚒|HLF">🚒 HLF</button><button data-type="🚑|RTW">🚑 RTW</button><button data-type="👨‍🚒|Gruppenführer">👨‍🚒 Gruppenführer</button><button data-type="👨‍🚒|Maschinist">👨‍🚒 Maschinist</button><button data-type="👨‍🚒|Angriffstrupp">👨‍🚒 Angriffstrupp</button><button data-type="👨‍🚒|Wassertrupp">👨‍🚒 Wassertrupp</button><button data-type="👨‍🚒|Schlauchtrupp">👨‍🚒 Schlauchtrupp</button><button data-type="💧|Hydrant">💧 Hydrant</button><button data-type="🔀|Verteiler">🔀 Verteiler</button><button data-type="🔥|Brand">🔥 Brand</button><button data-type="⚠️|Gefahr">⚠️ Gefahr</button><label class="upload">🗺️ Luftbild / Grundriss laden<input id="photo" type="file" accept="image/*"></label><button id="remove">Ausgewähltes Symbol löschen</button><button id="clear">Lagekarte leeren</button><button id="save">Lage speichern</button><label class="upload">Lage laden<input id="load" type="file" accept="application/json,.json"></label><p class="hint">Die Symbole sind didaktische Platzhalter, keine normgerechten taktischen Zeichen.</p></aside><section><div id="status">Bereit: Symbol auswählen.</div><div id="board"></div></section></main><script>
(()=>{'use strict';const board=document.querySelector('#board'),status=document.querySelector('#status');let pending=null,selected=null,drag=null;const items=[];function msg(t){status.textContent=t}function select(el){document.querySelectorAll('.token').forEach(e=>e.classList.remove('selected'));selected=el;if(el)el.classList.add('selected')}function add(icon,name,x,y){const el=document.createElement('div');el.className='token';el.innerHTML='<strong></strong><span></span>';el.querySelector('strong').textContent=icon;el.querySelector('span').textContent=name;el.style.left=x+'px';el.style.top=y+'px';board.appendChild(el);items.push(el);return el}document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{pending=b.dataset.type.split('|');msg(pending[1]+' gewählt – auf die Karte tippen.')}));board.addEventListener('pointerdown',e=>{const t=e.target.closest('.token');if(t){select(t);drag={el:t,id:e.pointerId,x:e.clientX,y:e.clientY,left:parseFloat(t.style.left),top:parseFloat(t.style.top),moved:false};t.setPointerCapture(e.pointerId);e.preventDefault()}else if(pending){const r=board.getBoundingClientRect();select(add(pending[0],pending[1],Math.max(0,e.clientX-r.left-38),Math.max(0,e.clientY-r.top-20)));pending=null;msg('Symbol platziert. Mit dem Finger verschieben.');e.preventDefault()}else select(null)});board.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;d.moved=true;d.el.style.left=Math.max(0,Math.min(board.clientWidth-d.el.offsetWidth,d.left+e.clientX-d.x))+'px';d.el.style.top=Math.max(0,Math.min(board.clientHeight-d.el.offsetHeight,d.top+e.clientY-d.y))+'px';e.preventDefault()});function stop(e){if(drag&&drag.id===e.pointerId){drag=null;msg('Position aktualisiert.')}}board.addEventListener('pointerup',stop);board.addEventListener('pointercancel',stop);document.querySelector('#remove').onclick=()=>{if(!selected)return msg('Zuerst ein Symbol antippen.');selected.remove();items.splice(items.indexOf(selected),1);select(null)};document.querySelector('#clear').onclick=()=>{if(!confirm('Alle Symbole entfernen?'))return;items.splice(0).forEach(e=>e.remove());select(null)};document.querySelector('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{board.style.backgroundImage='url('+JSON.stringify(reader.result)+')';msg('Hintergrund geladen.')};reader.readAsDataURL(f)};document.querySelector('#save').onclick=()=>{const data=items.map(el=>({icon:el.querySelector('strong').textContent,name:el.querySelector('span').textContent,x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='feuerwehr-lage.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#load').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error('Ungültige Lage');items.splice(0).forEach(el=>el.remove());data.forEach(o=>add(String(o.icon),String(o.name),Number(o.x),Number(o.y)));msg('Lage geladen.')}catch(err){msg('Laden fehlgeschlagen: '+err.message)}};})();
</script></body></html>
